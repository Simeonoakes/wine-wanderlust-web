name = "invinoveritassite"
compatibility_date = "2024-01-01"

[build]
command = "npm run build"
cwd = "."
watch_dirs = ["src"]
watch_files = ["package.json", "vite.config.ts", "tailwind.config.js"]

[build.environment_variables]
NODE_VERSION = "20"

[[build.upload]]
format = "modules"
main = "./dist/index.html"
